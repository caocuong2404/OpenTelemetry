# OpenTelemetry Collector (contrib) — instance configuration
# Docs: https://opentelemetry.io/docs/collector/configuration/

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  zpages:
    endpoint: 0.0.0.0:55679
  pprof:
    endpoint: 0.0.0.0:1777

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 200ms
    send_batch_size: 8192

exporters:
  debug:
    verbosity: normal

  # One file per signal so the three pipelines never share a handle, and so
  # each signal can be asserted on independently by scripts/smoke-test.sh.
  file/traces:
    path: /var/log/otelcol/traces.json
    create_directory: true
    flush_interval: 1s
    rotation:
      max_megabytes: 50
      max_days: 7
      max_backups: 3
  file/metrics:
    path: /var/log/otelcol/metrics.json
    create_directory: true
    flush_interval: 1s
    rotation:
      max_megabytes: 50
      max_days: 7
      max_backups: 3
  file/logs:
    path: /var/log/otelcol/logs.json
    create_directory: true
    flush_interval: 1s
    rotation:
      max_megabytes: 50
      max_days: 7
      max_backups: 3

service:
  extensions: [health_check, zpages, pprof]
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file/metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug, file/logs]
