name: otel-instance

services:
  lgtm:
    # All-in-one OpenTelemetry backend from Grafana: OpenTelemetry Collector,
    # Prometheus (metrics), Tempo (traces), Loki (logs), Pyroscope (profiles)
    # and Grafana (UI), pre-wired to each other.
    #   https://hub.docker.com/r/grafana/otel-lgtm
    image: grafana/otel-lgtm:${LGTM_VERSION:?set LGTM_VERSION in .env}
    container_name: otel-lgtm
    init: true
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      # Give the backends enough retention to keep a lab session around.
      PROMETHEUS_EXTRA_ARGS: "--storage.tsdb.retention.time=7d"
      # This image silences component logs by default, which makes a broken
      # pipeline hard to see. Keep the collector's and Loki's on.
      ENABLE_LOGS_OTELCOL: "true"
      ENABLE_LOGS_LOKI: "true"
    volumes:
      # All components write under /data. A named volume rather than a bind
      # mount: Loki/Prometheus keep WAL-backed stores, and a macOS virtiofs
      # bind mount is a known hazard for those.
      - lgtm-data:/data
      # Grafana dashboards, provisioned from this repo so they survive a
      # container rebuild and can be reviewed in git. The image keeps Grafana
      # under /otel-lgtm/grafana and reads provisioning from conf/provisioning;
      # these mount as extra files so its own providers stay untouched.
      - ./grafana-provisioning/dashboards-litellm.yml:/otel-lgtm/grafana/conf/provisioning/dashboards/litellm.yml:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"    # Grafana web UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "9090:9090"    # Prometheus
      - "3200:3200"    # Tempo
      - "4040:4040"    # Pyroscope
      # Upstream's run-lgtm.sh does not publish Loki; mapped here so logs are
      # queryable from the host and assertable by scripts/smoke-test.sh.
      - "3100:3100"    # Loki
    restart: unless-stopped

volumes:
  lgtm-data:
